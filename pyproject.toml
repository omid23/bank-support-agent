[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-support-agent"
version = "0.1.0"
description = "Banking support agent over a 698-document policy base: hybrid retrieval, a pre-execution policy guard, tau3-bench integration and a Pipecat voice layer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Omid Beigi" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# tau2-bench needs its source checkout for data: install it with scripts/install_tau2.sh (Python 3.12+).
tau2 = ["rank-bm25>=0.2.2", "websockets>=13"]
vertex = ["google-auth[requests]>=2.20"]  # Claude on Google Cloud Vertex AI
voice = ["pipecat-ai[cartesia,deepgram,runner,silero,webrtc]>=1.12,<2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "rank-bm25>=0.2.2"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
