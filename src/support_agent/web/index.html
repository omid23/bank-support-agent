<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rho-Bank Support Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --mint-1: #f4fbf8;
  --mint-2: #e2f4ec;
  --ink: #05241d;
  --ink-2: #2e5a4e;
  --line: rgba(5, 36, 29, .12);
  --glass: rgba(255, 255, 255, .64);
  --glass-strong: rgba(255, 255, 255, .86);
  --accent: #00a676;
  --accent-soft: rgba(0, 166, 118, .13);
  --stop: #d7263d;
  --stop-soft: rgba(215, 38, 61, .1);
  --radius: 5px;
  --sans: "Public Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--mint-2); }
body { font: 14px/1.5 var(--sans); color: var(--ink); min-height: 100vh;
  background: linear-gradient(165deg, var(--mint-1) 0%, var(--mint-2) 100%) fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid rgba(255, 255, 255, .75); border-radius: var(--radius);
  box-shadow: 0 1px 0 rgba(5, 36, 29, .04), 0 10px 28px rgba(5, 36, 29, .06); }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 12px 24px; border-bottom: 1px solid var(--line); background: rgba(244, 251, 248, .82); backdrop-filter: blur(12px); }
.brand { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
nav { display: flex; gap: 2px; }
nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
nav button:hover { background: var(--glass-strong); }
nav button[aria-selected="true"] { color: var(--ink); background: var(--glass-strong); box-shadow: inset 0 -2px 0 var(--accent); }
.status-line { margin-left: auto; color: var(--ink-2); font-size: 13px; }
main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 48px; }
@media (max-width: 900px) { main { padding: 16px; } header.top { padding: 10px 16px; gap: 10px; } .status-line { margin-left: 0; width: 100%; } }
section[hidden] { display: none !important; }
h2 { font-size: 15px; margin: 0 0 10px; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* guard view */
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.rail { padding: 10px; align-self: start; position: sticky; top: 70px; max-height: calc(100vh - 92px); display: flex; flex-direction: column; }
@media (max-width: 900px) { .rail { position: static; max-height: 300px; } }
.rail input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass-strong); margin-bottom: 8px; }
.list { overflow: auto; }
.task { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
.task:hover { background: rgba(255, 255, 255, .7); }
.task[aria-current="true"] { background: var(--glass-strong); box-shadow: inset 3px 0 0 var(--accent); }
.task .id { font-family: var(--mono); font-size: 12.5px; }
.task .op { color: var(--ink-2); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 3px; margin-left: 6px; color: var(--ink-2); }
.panel { padding: 18px 20px; }
.quote { margin: 0 0 14px; padding-left: 12px; border-left: 3px solid var(--accent); max-width: 78ch; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 16px; }
.seg { border: 1px solid var(--line); background: var(--glass-strong); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.docs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.doc { max-width: 100%; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; padding: 2px 7px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 3px; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
@media (max-width: 600px) { .step { grid-template-columns: 1fr auto; } .who { grid-column: 1 / -1; } }
.who { font-size: 12px; color: var(--ink-2); padding-top: 1px; }
.call .n { font-family: var(--mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.call .a { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; margin-top: 2px; }
.call .why { font-size: 13px; margin-top: 6px; color: var(--stop); max-width: 80ch; }
.call .adv { font-size: 12.5px; margin-top: 4px; color: var(--ink-2); }
.v { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 3px; white-space: nowrap; }
.v.ok { background: var(--accent-soft); color: #00734f; }
.v.no { background: var(--stop-soft); color: var(--stop); }
.v.na { color: var(--ink-2); font-weight: 500; }
.step.skipped { opacity: .45; }
.step.target .call .n { text-decoration: underline; text-decoration-color: var(--stop); text-underline-offset: 3px; }
.summary { margin: 0 0 12px; font-size: 13.5px; }

/* search */
.searchbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.searchbar input { flex: 1 1 320px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass-strong); }
.hit { padding: 12px 0; border-top: 1px solid var(--line); }
.hit:first-child { border-top: 0; }
.hit .t { font-weight: 600; }
.hit .meta { font-size: 12px; color: var(--ink-2); }
.hit p { margin: 4px 0 0; max-width: 90ch; }
.tools { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.tool { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 3px; background: var(--accent-soft); }

/* results */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 20px; align-items: start; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
.grid > * { min-width: 0; overflow-x: auto; }
.figure { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.figure small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 6px 8px; border-top: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-2); border-top: 0; }
.scroll { overflow-x: auto; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 10px 0 0; max-width: 80ch; }

/* chat */
.chat { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; }
@media (max-width: 900px) { .chat { grid-template-columns: 1fr; } }
.log { min-height: 340px; max-height: 60vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 5px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent-soft); }
.msg.agent { align-self: flex-start; background: var(--glass-strong); border: 1px solid var(--line); }
.compose { display: flex; gap: 8px; }
.compose input { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass-strong); }
.btn { border: 0; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.ev { font-family: var(--mono); font-size: 11.5px; padding: 6px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.empty { color: var(--ink-2); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Rho-Bank support agent</div>
  <nav role="tablist">
    <button role="tab" data-view="guard" aria-selected="true">Guard</button>
    <button role="tab" data-view="search" aria-selected="false">Knowledge</button>
    <button role="tab" data-view="results" aria-selected="false">Results</button>
    <button role="tab" data-view="chat" aria-selected="false">Chat</button>
  </nav>
  <div class="status-line" id="status">Loading…</div>
</header>

<main>
  <section id="view-guard">
    <div class="split">
      <aside class="glass rail">
        <input id="filter" type="search" placeholder="Filter tasks" aria-label="Filter tasks">
        <div class="list" id="tasks"></div>
      </aside>
      <div class="glass panel" id="trace"><p class="empty">Pick a task to see the guard judge its reference solution.</p></div>
    </div>
  </section>

  <section id="view-search" hidden>
    <div class="glass panel">
      <div class="searchbar">
        <input id="q" type="search" placeholder="Ask what a customer would ask, e.g. my card was charged twice" aria-label="Search the knowledge base">
        <button class="seg" data-mode="hybrid" aria-pressed="true">Hybrid</button>
        <button class="seg" data-mode="bm25" aria-pressed="false">BM25</button>
        <button class="seg" data-mode="dense" aria-pressed="false">Dense</button>
      </div>
      <div id="hits"><p class="empty">698 policy and procedure documents. Results list the internal tools each document names.</p></div>
    </div>
  </section>

  <section id="view-results" hidden>
    <div class="grid" id="results"></div>
  </section>

  <section id="view-chat" hidden>
    <div class="chat">
      <div class="glass panel">
        <div class="log" id="log"></div>
        <form class="compose" id="compose">
          <input id="say" placeholder="Hi, I'd like to dispute a charge" aria-label="Message">
          <button class="btn" id="send">Send</button>
        </form>
      </div>
      <aside class="glass panel">
        <h2>What the agent did</h2>
        <div id="events"><p class="empty">Searches, guard verdicts and bank calls appear here.</p></div>
      </aside>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const get = async url => { const r = await fetch(url); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const pct = x => x == null ? "–" : (100 * x).toFixed(1) + "%";

let TASKS = [], PERTS = [], current = null, perturbation = "", chatOK = false, session = null;

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== "view-" + b.dataset.view);
  if (b.dataset.view === "results") loadResults();
  if (b.dataset.view === "search") $("#q").focus();
}));

async function init() {
  const st = await get("/api/status");
  chatOK = st.chat;
  $("#status").textContent = `${st.documents} documents, ${st.tasks} τ³-Banking tasks` + (st.chat ? ", model connected" : "");
  const t = await get("/api/tasks");
  TASKS = t.tasks; PERTS = t.perturbations;
  renderTasks();
  if (!chatOK) {
    $("#log").innerHTML = '<p class="empty">Chat needs a model. Set ANTHROPIC_API_KEY or OPENAI_API_KEY and restart the console.</p>';
    $("#say").disabled = $("#send").disabled = true;
  }
}

function renderTasks() {
  const f = $("#filter").value.toLowerCase();
  $("#tasks").innerHTML = TASKS.filter(t => !f || (t.id + " " + t.opening).toLowerCase().includes(f)).map(t => `
    <button class="task" data-id="${t.id}" aria-current="${t.id === current}">
      <span class="id">${t.id}</span><span class="tag">${t.split}</span><span class="tag">${t.calls} calls</span>
      <span class="op">${esc(t.opening)}</span>
    </button>`).join("");
  document.querySelectorAll(".task").forEach(b => b.addEventListener("click", () => { current = b.dataset.id; perturbation = ""; renderTasks(); loadTrace(); }));
}
$("#filter").addEventListener("input", renderTasks);

const PLABEL = {"": "Reference", skip_verification: "Skip verification", other_customer: "Other customer's account",
  invented_tool: "Invented tool", undocumented_tool: "Tool not in docs read", call_before_unlock: "Call before unlock"};

async function loadTrace() {
  const box = $("#trace");
  let data;
  try { data = await get(`/api/trace?task=${current}&perturb=${perturbation}`); }
  catch (e) { box.querySelector(".steps")?.remove(); box.querySelector(".summary").textContent = e.message; return; }
  const blocked = data.steps.find(s => s.verdict && !s.verdict.allowed);
  const checked = data.steps.filter(s => s.verdict).length;
  const target = data.steps.find(s => s.target);
  let summary;
  if (!perturbation) summary = blocked ? `The guard blocks the reference solution at step ${blocked.i + 1} (${blocked.verdict.rule}).` : `All ${checked} agent calls in the reference solution pass the guard.`;
  else summary = blocked && target && blocked.i === target.i ? `Broken copy: the guard stops the unsafe call at step ${blocked.i + 1}.` :
    blocked ? `Broken copy: blocked at step ${blocked.i + 1}, not at the altered call.` : "Broken copy: the unsafe call was not caught.";
  box.innerHTML = `
    <h2>${data.task}</h2>
    <blockquote class="quote">${esc(data.opening)}</blockquote>
    <div class="docs">${data.required_documents.map(d => `<span class="doc">${esc(d)}</span>`).join("")}</div>
    <div class="controls">${["", ...PERTS].map(p => `<button class="seg" data-p="${p}" aria-pressed="${p === perturbation}">${PLABEL[p] || p}</button>`).join("")}</div>
    <p class="summary">${summary}</p>
    <ol class="steps">${data.steps.map(stepRow).join("")}</ol>`;
  box.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { perturbation = b.dataset.p; loadTrace(); }));
}

function stepRow(s) {
  const args = Object.entries(s.args || {}).map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join("  ");
  let v = '<span class="v na">customer</span>', why = "";
  if (s.verdict) {
    v = s.verdict.allowed ? `<span class="v ok">allowed</span>` : `<span class="v no">blocked</span>`;
    if (!s.verdict.allowed) why = `<div class="why">${esc(s.verdict.rule)}: ${esc(s.verdict.message)}</div>`;
    else if (s.verdict.advisory) why = `<div class="adv">${esc(s.verdict.advisory)}</div>`;
  } else if (s.skipped) v = '<span class="v na">not run</span>';
  const name = s.tool && s.tool !== s.name ? `${s.name} → ${s.tool}` : s.name;
  return `<li class="step ${s.skipped ? "skipped" : ""} ${s.target ? "target" : ""}">
    <div class="who">${s.i + 1}. ${s.who === "assistant" ? "agent" : "customer"}</div>
    <div class="call"><div class="n">${esc(name)}</div><div class="a">${esc(args).slice(0, 360)}</div>${why}</div>
    <div>${v}${s.us != null ? `<div class="muted mono" style="text-align:right">${s.us} µs</div>` : ""}</div></li>`;
}

let mode = "hybrid", timer = null;
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b)); search();
}));
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 200); });
async function search() {
  const q = $("#q").value.trim();
  if (!q) return;
  const r = await get(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}&k=8`);
  $("#hits").innerHTML = `<p class="muted" style="margin:0 0 6px">${r.hits.length} results in ${r.ms} ms</p>` + r.hits.map(h => `
    <div class="hit"><div class="t">${esc(h.title)}</div>
      <div class="meta mono">${esc(h.id)}${h.section ? " · " + esc(h.section) : ""} · ${h.score}</div>
      <p>${esc(h.snippet.replace(/#+\s*/g, "").replace(/\*\*/g, ""))}</p>
      ${h.tools.length ? `<div class="tools">${h.tools.map(t => `<span class="tool">${esc(t)}</span>`).join("")}</div>` : ""}</div>`).join("");
}

let resultsLoaded = false;
async function loadResults() {
  if (resultsLoaded) return;
  const r = await get("/api/reports");
  const cards = [];
  if (r.harness) {
    const h = r.harness;
    cards.push(`<div class="glass panel"><h2>Reference solutions through the τ³ harness</h2>
      <div class="figure">${h.reward_1_guard_on} / ${h.tasks}<small>tasks at reward 1.0 with the guard on</small></div>
      <table><tr><th></th><th>reward 1.0</th></tr><tr><td>guard off</td><td>${h.reward_1_guard_off} / ${h.tasks}</td></tr>
      <tr><td>guard on</td><td>${h.reward_1_guard_on} / ${h.tasks}</td></tr></table>
      <p class="note">Graded by tau2's own evaluator on final database state. Lost to the guard: ${h.lost_to_guard.join(", ") || "none"}.</p></div>`);
  }
  if (r.guard) {
    const g = r.guard;
    const rows = Object.entries(g.catches).map(([k, c]) => `<tr><td>${PLABEL[k] || k}</td><td>${c.caught} / ${c.cases}</td><td>${pct(c.rate)}</td></tr>`).join("");
    cards.push(`<div class="glass panel"><h2>Policy guard</h2>
      <div class="figure">${g.false_block_tasks}<small>of ${g.tasks} correct solutions blocked</small></div>
      <table><tr><th>broken copy</th><th>caught at the unsafe call</th><th>rate</th></tr>${rows}</table>
      <p class="note">${g.assistant_calls_checked} agent calls checked, ${g.mean_check_us} µs mean per check. Blocked reference solutions: ${g.false_blocks.map(b => `${b.task} (${b.rule})`).join(", ") || "none"}.</p></div>`);
  }
  for (const split of ["dev", "test"]) {
    const x = r["retrieval_" + split];
    if (!x) continue;
    const rows = [];
    for (const s of Object.values(x.results))
      rows.push(`<tr><td>${esc(s.method)}</td><td>${esc(s.query)}</td><td>${pct(s["recall@10"])}</td><td>${pct(s["tools@10"])}</td><td>${(s.mrr ?? 0).toFixed(3)}</td></tr>`);
    cards.push(`<div class="glass panel"><h2>Retrieval, ${split} split (${x.tasks} tasks)</h2><div class="scroll">
      <table><tr><th>method</th><th>query</th><th>recall@10</th><th>tool docs@10</th><th>MRR</th></tr>${rows.join("")}</table></div>
      <p class="note">One-shot queries from the task: the customer's opening line, or the whole scenario. A live agent searches several times.</p></div>`);
  }
  if (r.voice_latency) {
    const rows = r.voice_latency.map(v => `<tr><td>${v.model_ms_per_call}</td><td>${v.first_output_p50_ms}</td><td>${v.first_output_p95_ms}</td><td>${v.agent_turn_p50_ms}</td><td>${v.fillers}/${v.turns}</td></tr>`).join("");
    cards.push(`<div class="glass panel"><h2>Voice turn latency (offline)</h2><div class="scroll">
      <table><tr><th>model ms / call</th><th>first output p50</th><th>p95</th><th>agent turn p50</th><th>fillers</th></tr>${rows}</table></div>
      <p class="note">End of caller speech to first sentence handed to TTS. STT, TTS and network not included.</p></div>`);
  }
  $("#results").innerHTML = cards.join("") || '<p class="empty">No reports yet. Run the eval commands with --out reports/&lt;name&gt;.</p>';
  resultsLoaded = true;
}

$("#compose").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("#say").value.trim();
  if (!text || !chatOK) return;
  $("#say").value = ""; $("#send").disabled = true;
  $("#log").insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div>`);
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({text, session})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    session = j.session;
    $("#log").insertAdjacentHTML("beforeend", `<div class="msg agent">${esc(j.reply)}</div>`);
    const evs = j.events.filter(e => ["search", "read", "guard", "bank"].includes(e.kind)).map(e => {
      if (e.kind === "search") return `search “${esc(e.query)}” → ${e.docs.slice(0, 3).map(esc).join(", ")}`;
      if (e.kind === "read") return `read ${esc(e.doc)}`;
      if (e.kind === "guard") return `${e.allowed ? "allowed" : "BLOCKED"} ${esc(e.tool)}${e.allowed ? "" : " (" + esc(e.rule) + ")"}`;
      return `bank ${esc(e.tool)}${e.error ? " (error)" : ""}`;
    });
    if (evs.length) { if ($("#events .empty")) $("#events").innerHTML = ""; $("#events").insertAdjacentHTML("beforeend", evs.map(x => `<div class="ev">${x}</div>`).join("")); }
  } catch (err) {
    $("#log").insertAdjacentHTML("beforeend", `<div class="msg agent">${esc(err.message)}</div>`);
  }
  $("#send").disabled = false; $("#log").scrollTop = 1e9; $("#say").focus();
});

init().catch(e => $("#status").textContent = e.message);
</script>
</body>
</html>
